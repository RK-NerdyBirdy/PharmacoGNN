<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaGNN Workspace — Regimen simulation</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/workspace.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="workspace-body screen-simulation">

<div class="workspace-shell">

  <aside class="workspace-sidebar">
    <div class="brand">
      <span class="brand-toggle"><span class="brand-toggle-dot"></span></span>
      <span class="brand-name">PharmaGNN</span>
    </div>

    <div class="sidebar-label">Clinical workspace</div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-callout">
      <p class="sidebar-callout-title">A clearer picture.</p>
      <p class="sidebar-callout-text">Every pair. Every pathway. One considered decision.</p>
    </div>

    <a class="sidebar-footer-link" href="../index.html">&larr; Research demo</a>
  </aside>

  <div class="workspace-main">

    <header class="workspace-topbar">
      <div class="topbar-right">
        <div class="avatar" id="userAvatar"></div>
      </div>
    </header>

    <main class="workspace-content"><h1 class="workspace-heading">Preview the change before making it.</h1><p class="workspace-subhead" id="simulationSubtitle"></p><div id="simulationContent"></div></main>

    <footer class="workspace-footer">
      <span id="footerLeft"></span>
      <span id="footerRight"></span>
    </footer>

  </div>
</div>

<script src="../js/demo-store.js"></script>
<script src="../js/workspace-shared.js"></script>
<script src="../js/regimen-simulation.js"></script>
</body>
</html>
