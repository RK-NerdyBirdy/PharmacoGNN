<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaGNN Workspace — Patient</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/workspace.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="workspace-body screen-patients">

<div class="workspace-shell">
  <aside class="workspace-sidebar">
    <div class="brand">
      <span class="brand-toggle"><span class="brand-toggle-dot"></span></span>
      <span class="brand-name">PharmaGNN</span>
    </div>
    <div class="sidebar-label">Clinical workspace</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-callout">
      <p class="sidebar-callout-title"></p>
      <p class="sidebar-callout-text"></p>
    </div>
    <a class="sidebar-footer-link" href="../index.html">&larr; Research demo</a>
  </aside>

  <div class="workspace-main">
    <header class="workspace-topbar">
      <div class="topbar-right">
        <div class="avatar" id="userAvatar"></div>
      </div>
    </header>

    <main class="workspace-content">
      <a class="case-breadcrumb" href="patients.html">&larr; Patients</a>
      <h1 class="workspace-heading" id="pageHeading">Patient</h1>
      <p class="workspace-subhead" id="pageSubhead"></p>

      <article class="ws-card" id="profileCard"></article>

      <article class="ws-card">
        <header class="ws-card-header">
          <h2>Active medications</h2>
          <p class="ws-card-note" id="regimensNote"></p>
        </header>
        <button class="add-medicine-btn" id="addRegimenBtn" type="button">+ Add medication</button>
        <ul class="medicine-list" id="regimenList"></ul>
      </article>

      <article class="ws-card">
        <header class="ws-card-header">
          <h2>Conditions</h2>
        </header>
        <button class="add-medicine-btn" id="addConditionBtn" type="button">+ Add condition</button>
        <ul class="medicine-list" id="conditionList"></ul>
      </article>

      <article class="ws-card">
        <header class="ws-card-header">
          <h2>Interaction reports</h2>
          <p class="ws-card-note" id="reportsNote"></p>
        </header>
        <button class="btn btn-primary" id="generateReportBtn" type="button">Generate report</button>
        <p class="ws-card-footnote" id="reportGenerateNote"></p>
        <ul class="medicine-list" id="reportList"></ul>
      </article>

      <article class="ws-card">
        <header class="ws-card-header">
          <h2>Care team &amp; transfer</h2>
        </header>
        <ul class="medicine-list" id="accessList"></ul>
        <button class="btn btn-secondary" id="initiateTransferBtn" type="button">Transfer to another clinician</button>
        <ul class="medicine-list" id="transferList"></ul>
      </article>
    </main>

    <footer class="workspace-footer">
      <span id="footerLeft"></span>
      <span id="footerRight"></span>
    </footer>
  </div>
</div>

<script src="../js/api-client.js"></script>
<script src="../js/logout-flow.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/demo-store.js"></script>
<script src="../js/preferences.js"></script>
<script src="../js/workspace-shared.js"></script>
<script src="../js/patient-detail.js"></script>
</body>
</html>
