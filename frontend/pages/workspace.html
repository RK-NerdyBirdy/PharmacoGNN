<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaGNN Workspace — Regimen overview</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/workspace.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="workspace-body screen-overview">

<div class="workspace-shell">

  <aside class="workspace-sidebar">
    <div class="brand">
      <span class="brand-toggle"><span class="brand-toggle-dot"></span></span>
      <span class="brand-name">PharmaGNN</span>
    </div>

    <div class="sidebar-label">Clinical workspace</div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-callout">
      <p class="sidebar-callout-title">A clearer picture.</p>
      <p class="sidebar-callout-text">Every pair. Every pathway. One considered decision.</p>
    </div>

    <a class="sidebar-footer-link" href="../index.html">&larr; Research demo</a>
  </aside>

  <div class="workspace-main">

    <header class="workspace-topbar">
      <div class="topbar-right">
        <div class="avatar" id="userAvatar"></div>
      </div>
    </header>

    <main class="workspace-content">
      <h1 class="workspace-heading" id="pageHeading"></h1>
      <p class="workspace-subhead" id="pageSubhead"></p>

      <section class="context-bar" id="contextBar"></section>

      <section class="workspace-grid">
        <article class="ws-card" id="medicinesCard">
          <header class="ws-card-header">
            <h2>Current medicines</h2>
            <p class="ws-card-note" id="medicinesNote"></p>
          </header>
          <button class="add-medicine-btn" id="addMedicineBtn" type="button">+ Add a medicine</button>
          <ul class="medicine-list" id="medicineList"></ul>
          <p class="ws-card-footnote" id="medicinesFootnote"></p>
        </article>

        <article class="ws-card" id="matrixCard">
          <header class="ws-card-header matrix-card-header">
            <div>
              <h2>Interaction matrix</h2>
              <p class="ws-card-note" id="matrixNote"></p>
            </div>
            <button class="btn btn-outline matrix-3d-btn" id="viewDrugGraphBtn" type="button">View 3D map</button>
          </header>
          <div class="matrix-wrap">
            <table class="interaction-matrix" id="interactionMatrix"></table>
          </div>
          <p class="matrix-key" id="matrixLegendLabels"></p>
          <div class="matrix-legend" id="matrixLegend"></div>
          <p class="ws-card-footnote" id="matrixFootnote"></p>
        </article>

        <div class="ws-side-stack">
          <article class="ws-card review-card" id="reviewCard">
            <header class="ws-card-header">
              <h2 id="reviewTitle">Review first</h2>
              <p class="ws-card-note" id="reviewNote"></p>
            </header>
            <span class="priority-pill" id="priorityPill"></span>
            <div class="score-row">
              <span class="score-value" id="scoreValue"></span>
              <span class="score-max" id="scoreMax"></span>
            </div>
            <p class="score-caption" id="scoreCaption"></p>
            <p class="review-description" id="reviewDescription"></p>
            <button class="btn btn-primary ws-btn-block" id="inspectPathwayBtn" type="button"></button>
          </article>

          <article class="ws-card explore-card" id="exploreCard">
            <header class="ws-card-header">
              <h2 id="exploreTitle"></h2>
            </header>
            <p class="explore-text" id="exploreText"></p>
            <button class="btn btn-secondary ws-btn-block" id="findAlternativesBtn" type="button"></button>
          </article>
        </div>
      </section>
    </main>

    <footer class="workspace-footer">
      <span id="footerLeft"></span>
      <span id="footerRight"></span>
    </footer>

  </div>
</div>

<script src="../js/api-client.js"></script>
<script src="../js/logout-flow.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/demo-store.js"></script>
<script src="../js/preferences.js"></script>
<script src="../js/workspace-shared.js"></script>
<script src="../js/molecule-viewer.js"></script>
<script src="../js/dot-field.js"></script>
<script src="../js/drug-graph.js"></script>
<script src="../js/workspace.js"></script>
</body>
</html>
