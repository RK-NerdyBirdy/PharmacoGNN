<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaGNN Workspace — Substitution engine</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/workspace.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="workspace-body screen-substitution">

<div class="workspace-shell">

  <aside class="workspace-sidebar">
    <div class="brand">
      <span class="brand-toggle"><span class="brand-toggle-dot"></span></span>
      <span class="brand-name">PharmaGNN</span>
    </div>
    <div class="sidebar-label">Clinical workspace</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-callout">
      <p class="sidebar-callout-title"></p>
      <p class="sidebar-callout-text"></p>
    </div>
    <a class="sidebar-footer-link" href="../index.html">&larr; Research demo</a>
  </aside>

  <div class="workspace-main">

    <header class="workspace-topbar">
      <div class="topbar-right">
        <div class="avatar" id="userAvatar"></div>
      </div>
    </header>

    <main class="workspace-content">
      <h1 class="workspace-heading" id="pageHeading"></h1>
      <p class="workspace-subhead" id="pageSubhead"></p>

      <section class="ws-card replace-card" id="replaceCard"></section>

      <div class="comparison-heading-row">
        <h2>Candidate comparison</h2>
        <span class="comparison-note" id="rankedNote"></span>
      </div>

      <section class="candidate-grid">
        <article class="ws-card candidate-list-card">
          <ul class="candidate-list" id="candidateList"></ul>
        </article>

        <article class="ws-card candidate-detail-card" id="candidateDetailCard"></article>
      </section>

      <p class="candidate-banner" id="candidateBanner"></p>
    </main>

    <footer class="workspace-footer">
      <span id="footerLeft"></span>
      <span id="footerRight"></span>
    </footer>

  </div>
</div>

<script src="../js/demo-store.js"></script>
<script src="../js/workspace-shared.js"></script>
<script src="../js/substitution-engine.js"></script>
</body>
</html>
