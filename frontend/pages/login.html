<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PharmaGNN — Sign in</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/workspace.css" />
</head>
<body class="workspace-body">
<div class="auth-page">
  <div class="auth-card ws-card">
    <div class="brand auth-brand">
      <span class="brand-toggle"><span class="brand-toggle-dot"></span></span>
      <span class="brand-name">PharmaGNN</span>
    </div>

    <form id="loginForm">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Access your regimen workspace.</p>

      <label class="field-label" for="loginEmail">Email</label>
      <input class="field-box" id="loginEmail" type="email" required autocomplete="email" />

      <label class="field-label" for="loginPassword">Password</label>
      <input class="field-box" id="loginPassword" type="password" required autocomplete="current-password" />

      <p class="auth-error" id="loginError" role="alert"></p>
      <button class="btn btn-primary ws-btn-block auth-submit" type="submit">Sign in</button>
    </form>

    <form id="registerForm" hidden>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Set up access to the regimen workspace.</p>

      <label class="field-label" for="registerEmail">Email</label>
      <input class="field-box" id="registerEmail" type="email" required autocomplete="email" />

      <label class="field-label" for="registerPassword">Password (min. 8 characters)</label>
      <input class="field-box" id="registerPassword" type="password" required minlength="8" autocomplete="new-password" />

      <label class="field-label" for="registerRole">I am a</label>
      <select class="field-box" id="registerRole">
        <option value="CLINICIAN">Clinician</option>
        <option value="PATIENT">Patient</option>
      </select>

      <p class="auth-error" id="registerError" role="alert"></p>
      <button class="btn btn-primary ws-btn-block auth-submit" type="submit">Create account</button>
    </form>

    <p class="auth-switch">
      <button type="button" id="showRegister">New here? Create an account</button>
      <button type="button" id="showLogin" hidden>Already have an account? Sign in</button>
    </p>
  </div>
</div>

<script src="../js/api-client.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
