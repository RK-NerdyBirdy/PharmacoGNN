name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacognn
          POSTGRES_PASSWORD: pharmacognn
          POSTGRES_DB: pharmacognn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacognn -d pharmacognn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # lfs: true is required -- backend/weights/*.pt and *.pth are Git LFS
      # pointers (see .gitattributes); a plain checkout leaves ~130-byte
      # pointer stubs in place of the real tensors, and gnn_engine.initialize()
      # fails to unpickle them, taking every test down with it.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # CPU-only wheel first (see backend/Dockerfile for why): otherwise pip
      # resolves torch's default CUDA-bundled build, which is large and
      # unnecessary here, then the torch>=2.3 line in requirements.txt below
      # is already satisfied and left alone.
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      # z_drug_cache.pt in backend/weights/ is fingerprinted by content hash
      # (not mtime), so it survives this checkout and initialize() takes
      # ~1s instead of ~25min recomputing the encoder over the full graph.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://pharmacognn:pharmacognn@localhost:5432/pharmacognn
          JWT_SECRET_KEY: ci-only-secret-not-used-outside-this-workflow
          FIELD_ENCRYPTION_KEY: 7RbcpflmD3L3IIQNbjFu9lIfB0J5XNs4v7OpzRzR37s=
        run: pytest -v
